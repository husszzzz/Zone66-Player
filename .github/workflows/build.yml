name: Build Zone66 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/Payload/Zone66.app

      - name: Compile complete SwiftUI app
        shell: bash
        run: |
          set -euo pipefail

          SWIFT_FILES=(
            Sources/App/ZhTeamApp.swift
            Sources/Core/Settings/AppSettings.swift
            Sources/Core/Theme/ThemeManager.swift
            Sources/Core/Theme/ZhTheme.swift
            Sources/Models/Channel.swift
            Sources/Services/ChannelRepository.swift
            Sources/Views/Main/MainTabView.swift
            Sources/Views/Home/HomeView.swift
            Sources/Views/Channels/ChannelsListView.swift
            Sources/Views/Favorites/FavoritesView.swift
            Sources/Views/Manager/ChannelManagerView.swift
            Sources/Views/Settings/SettingsView.swift
            Sources/Views/Player/CinemaPlayerView.swift
          )

          xcrun --sdk iphoneos swiftc             -target arm64-apple-ios15.0             -sdk "$(xcrun --sdk iphoneos --show-sdk-path)"             -O             -module-name Zone66             -framework Foundation             -framework UIKit             -framework SwiftUI             -framework AVFoundation             -framework AVKit             "${SWIFT_FILES[@]}"             -o build/Payload/Zone66.app/Zone66

      - name: Copy resources
        shell: bash
        run: |
          set -euo pipefail
          cp Resources/Info.plist build/Payload/Zone66.app/Info.plist
          cp Resources/ChannelsData.json build/Payload/Zone66.app/ChannelsData.json

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Zone66" build/Payload/Zone66.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Zone66" build/Payload/Zone66.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Zone66" build/Payload/Zone66.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.zone66.player" build/Payload/Zone66.app/Info.plist

          plutil -lint build/Payload/Zone66.app/Info.plist
          test -s build/Payload/Zone66.app/Zone66
          test -s build/Payload/Zone66.app/ChannelsData.json

      - name: Sign for TrollStore
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - build/Payload/Zone66.app
          codesign --verify --deep --strict --verbose=2 build/Payload/Zone66.app

      - name: Validate IPA structure
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -qry ../Zone66-Player.ipa Payload
          cd ..
          unzip -t Zone66-Player.ipa
          unzip -p Zone66-Player.ipa Payload/Zone66.app/Info.plist > /tmp/zone66-info.plist
          plutil -lint /tmp/zone66-info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zone66-Player-IPA
          path: Zone66-Player.ipa
          if-no-files-found: error
