name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Swift iOS App
        run: |
          mkdir -p build/Payload/Zone66.app
          
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -O \
            -framework UIKit \
            -framework AVFoundation \
            -framework AVKit \
            -framework SwiftUI \
            Sources/*.swift \
            Sources/Models/*.swift \
            Sources/Views/*.swift \
            -o build/Payload/Zone66.app/Zone66

          cp Resources/Info.plist build/Payload/Zone66.app/Info.plist
          cp Resources/ChannelsData.json build/Payload/Zone66.app/ChannelsData.json
          
          # Ad-hoc sign for TrollStore
          codesign -s - --force --deep build/Payload/Zone66.app

          cd build
          zip -qry ../Zone66-Player.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zone66-Player-Pro
          path: Zone66-Player.ipa
