name: Build Zone66 TV IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Zone66
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build/Payload/Zone66.app

          SWIFT_FILES=()
          while IFS= read -r file; do
            SWIFT_FILES+=("$file")
          done < <(find Sources/Zone66 -type f -name "*.swift" | sort)

          if [ "${#SWIFT_FILES[@]}" -eq 0 ]; then
            echo "No Zone66 Swift sources found"
            exit 1
          fi

          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -O \
            -swift-version 5 \
            -module-name Zone66 \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework AVKit \
            "${SWIFT_FILES[@]}" \
            -o build/Payload/Zone66.app/Zone66

          cp Resources/Info.plist build/Payload/Zone66.app/Info.plist
          mkdir -p build/Payload/Zone66.app
          cp Resources/ChannelsData.json build/Payload/Zone66.app/ChannelsData.json

          codesign -s - --force --deep build/Payload/Zone66.app

          cd build
          zip -qry ../Zone66-TV-PRO.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zone66-TV-PRO
          path: Zone66-TV-PRO.ipa
